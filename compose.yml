version: "3.9"

services:

  devopsdb:
    image: akshithjanagam/automation:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 6
    networks:
      - Akshnetwork

  application:
    image: akshithjanagam/automation:app
    ports:
      - "1111:8080"
    deploy:
      replicas: 6
    networks:
      - mynetwork
    depends_on:
      - devopsdb

networks:
  Akshnetwork:
    driver: overlay
